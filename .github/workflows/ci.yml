name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check the engine and app
        run: |
          node --check js/engine.js
          node --check js/app.js
      - name: Run engine tests
        run: node --test
