plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arya.accessflow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.arya.accessflow'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            // debuggable by default for the debug build type
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
